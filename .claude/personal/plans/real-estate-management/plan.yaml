schema_version: 1
id: real-estate-management
title: "Real estate management"
description: >
  A landlord's portfolio as a subpackage business_consulting.real_estate: properties,
  buildings and rental units, lease agreements, and the account the rent goes into. The tool
  checks the portfolio for consistency, matches the rent account's camt.053 bookings to
  tenants and claims, and monitors arrears. A Claude skill writes the portfolio file from
  conversation with the landlord; FinTS fetches the statements last.
default_repository: tomsch420/business_consulting-notes
tracking_issue: 127

waves:
  - id: foundation
    name: "Foundation"
    description: "Up-to-date krrood, then the model and the monitoring it carries out"
  - id: operation
    name: "Operation"
    description: "Running a portfolio, the operator skill, the live bank link"

tracks:
  - id: setup
    name: "Installation"
    wave: foundation
  - id: domain
    name: "Domain model and monitoring"
    wave: foundation
  - id: workflow
    name: "Portfolio workflow"
    wave: operation
  - id: bank-link
    name: "Bank link"
    wave: operation

items:
  - id: update-cram-and-krrood
    title: "Update cram and krrood on this PC, record the test baseline"
    repository: KAOS-repositories/business_consulting
    track: setup
    depends_on: []
    status: not started
    notes: >
      No PR. ~/cognitive_robot_abstract_machine is 181 commits behind cram/main. Run
      VIRTUAL_ENV=~/.virtualenvs/cram bash scripts/update_installation.sh, then
      ~/.virtualenvs/cram/bin/python -m pytest tests. Whatever the update breaks is fixed in
      its own bug PR off main before R1.
  - id: real-estate-roadmap
    title: "R1: process and roadmap documents for real estate"
    branch: real-estate-roadmap
    repository: KAOS-repositories/business_consulting
    track: domain
    depends_on: [update-cram-and-krrood]
    status: not started
    notes: >
      doc/real_estate_process.md (the landlord's workflow) and doc/real_estate_roadmap.md
      (status table R1-R9, open points), both in _toc.yml.
  - id: real-estate-model
    title: "R2: properties, buildings, units, leases, rent account"
    branch: real-estate-model
    repository: KAOS-repositories/business_consulting
    track: domain
    depends_on: [real-estate-roadmap]
    status: not started
    notes: >
      src/business_consulting/real_estate/: Property > Building > RentalUnit (UnitKind StrEnum,
      area m2); Portfolio (landlord Party, rent_account Account). LeaseAgreement: units,
      tenants (Party), start/end, notice timedelta, RentComponents (StrEnum kind, Money),
      dated RentChanges (§ 557a/557b BGB), SecurityDeposit. Due date defaults to new
      BankWorkingDayOfMonth(day=3) in payment_calendar.py (§ 556b (1) BGB). rent_due_in(month).
      ORM round trip test.
  - id: portfolio-consistency-checks
    title: "R3: consistency findings over the declared portfolio"
    branch: portfolio-consistency-checks
    repository: KAOS-repositories/business_consulting
    track: domain
    depends_on: [real-estate-model]
    status: not started
    notes: >
      real_estate/consistency.py: PortfolioCheck returns PortfolioFinding dataclasses, one per
      kind: unit leased twice over overlapping periods, vacant unit, lease ending before it
      starts, deposit above three net cold rents (§ 551 (1) BGB), tenant unmatchable (no
      account, no name), rent change before start, no rent account. Reported, never raised.
  - id: rent-claims
    title: "R4: what each lease owes, month by month"
    branch: rent-claims
    repository: KAOS-repositories/business_consulting
    track: domain
    depends_on: [real-estate-model]
    status: not started
    notes: >
      real_estate/rent_claims.py: RentClaim (lease, month, due date, amount by component),
      DepositInstalment; LeaseAgreement.claims_between(begin, end) with BankCalendar. First
      and last month pro rata by day.
  - id: rent-receipts-matching
    title: "R5: rent account bookings matched to tenants and claims"
    branch: rent-receipts-matching
    repository: KAOS-repositories/business_consulting
    track: domain
    depends_on: [rent-claims]
    status: not started
    notes: >
      real_estate/rent_ledger.py: Camt053Format into BankStatements, credits on the rent
      account; payer via PartyRegister seeded with tenants (partial match refused, decision
      F6). Allocate to the month the remittance names, else the oldest open claim
      (§ 366 (2) BGB). RentLedger per lease reusing the Settlement shape; unmatched receipts
      listed. Test on the Deutsche Kreditwirtschaft camt.053 examples under tests/.
  - id: arrears-monitoring
    title: "R6: arrears per lease and across the portfolio"
    branch: arrears-monitoring
    repository: KAOS-repositories/business_consulting
    track: domain
    depends_on: [rent-receipts-matching]
    status: not started
    notes: >
      real_estate/arrears.py: ArrearsStatus on a cut-off: overdue claims, days late, total
      owed; default from the due date (§ 286 (2) Nr. 1 BGB); flag the ground for termination
      without notice (§ 543 (2) Nr. 3, § 569 (3) Nr. 1 BGB); unpaid deposit instalments.
      PortfolioMonitoring summary.
  - id: structured-portfolio
    title: "R7: StructuredPortfolio, its questions, run_portfolio.py"
    branch: structured-portfolio
    repository: KAOS-repositories/business_consulting
    track: workflow
    depends_on: [portfolio-consistency-checks, arrears-monitoring]
    status: not started
    notes: >
      real_estate/structured_portfolio.py: subclassed in a file beside the documents,
      answering PortfolioQuestion members (unanswered raise UnansweredQuestion).
      SourceDocumentRoot gains a portfolios directory. scripts/run_portfolio.py reads the
      statements, runs checks and monitoring, writes portfolio.sqlite beside the documents.
      End-to-end test: two buildings, three leases.
  - id: manage-portfolio-skill
    title: "R8: operator skill manage-portfolio (and immobilien-verwalten)"
    branch: manage-portfolio-skill
    repository: KAOS-repositories/business_consulting
    track: workflow
    depends_on: [structured-portfolio]
    status: not started
    notes: >
      operator_workspace/dot_claude/skills/manage-portfolio, German immobilien-verwalten
      pointing at it. Claude asks about buildings, units, tenants and lease terms, writes the
      portfolio file, runs run_portfolio.py, reports findings and arrears; never edits the
      repository, files gaps as issues. Installed by set_up_operator_workspace.py.
  - id: fints-statements
    title: "R9: fetch the rent account's statements over FinTS"
    branch: fints-statements
    repository: KAOS-repositories/business_consulting
    track: bank-link
    depends_on: [rent-receipts-matching]
    status: not started
    notes: >
      Check PyPI first (python-fints). Fetch camt.053 or MT940 since the last statement into
      where the portfolio reads them; PIN asked at run time, never stored; TAN by the bank's
      procedure.
