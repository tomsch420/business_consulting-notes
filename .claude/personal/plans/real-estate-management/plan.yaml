  status: in progress
  notes: 'src/business_consulting/real_estate/: Property > Building > RentalUnit (UnitKind
    StrEnum, area m2); Portfolio (landlord Party, rent_account Account). LeaseAgreement: units,
    tenants (Party), start/end, notice timedelta, RentComponents (StrEnum kind, Money), dated
    RentChanges (§ 557a/557b BGB), SecurityDeposit. Due date defaults to new BankWorkingDayOfMonth(day=3)
    in payment_calendar.py (§ 556b (1) BGB). rent_due_in(month). ORM round trip test.

    '
- id: portfolio-consistency-checks
  title: 'R3: consistency findings over the declared portfolio'
  branch: portfolio-consistency-checks
  repository: KAOS-repositories/business_consulting
  track: domain
  pull_request_number: 133
  session: local:11904047-7994-426c-978f-18dbdf6e2f15
  depends_on:
  - real-estate-model
  status: in progress
  notes: 'real_estate/consistency.py: PortfolioCheck returns PortfolioFinding dataclasses,
    one per kind: unit leased twice over overlapping periods, vacant unit, lease ending before
    it starts, deposit above three net cold rents (§ 551 (1) BGB), tenant unmatchable (no
    account, no name), rent change before start, no rent account. Reported, never raised.

    '
- id: rent-claims
  title: 'R4: what each lease owes, month by month'
  branch: rent-claims
  repository: KAOS-repositories/business_consulting
  track: domain
  pull_request_number: 134
  session: local:f2cbb577-8b80-4608-b6bc-155a53d2432e
  depends_on:
  - real-estate-model
  status: in progress
  notes: 'real_estate/rent_claims.py: RentClaim (lease, month, due date, amount by component),
    DepositInstalment; LeaseAgreement.claims_between(begin, end) with BankCalendar. First
    and last month pro rata by day.

    '
- id: rent-receipts-matching
  title: 'R5: rent account bookings matched to tenants and claims'
  branch: rent-receipts-matching
  repository: KAOS-repositories/business_consulting
  track: domain
  pull_request_number: 135
  session: local:f2cbb577-8b80-4608-b6bc-155a53d2432e
  depends_on:
  - rent-claims
  status: in progress
  notes: 'real_estate/rent_ledger.py: Camt053Format into BankStatements, credits on the rent
    account; payer via PartyRegister seeded with tenants (partial match refused, decision
    F6). Allocate to the month the remittance names, else the oldest open claim (§ 366 (2)
    BGB). RentLedger per lease reusing the Settlement shape; unmatched receipts listed. Test
    on the Deutsche Kreditwirtschaft camt.053 examples under tests/.

    '
- id: arrears-monitoring
  title: 'R6: arrears per lease and across the portfolio'
  branch: arrears-monitoring
  repository: KAOS-repositories/business_consulting
  track: domain
  pull_request_number: 136
  session: local:f2cbb577-8b80-4608-b6bc-155a53d2432e
  depends_on:
  - rent-receipts-matching
  status: in progress
  notes: 'real_estate/arrears.py: ArrearsStatus on a cut-off: overdue claims, days late, total
    owed; default from the due date (§ 286 (2) Nr. 1 BGB); flag the ground for termination
    without notice (§ 543 (2) Nr. 3, § 569 (3) Nr. 1 BGB); unpaid deposit instalments. PortfolioMonitoring
    summary.

    '
- id: structured-portfolio
  title: 'R7: StructuredPortfolio, its questions, run_portfolio.py'
  branch: structured-portfolio
  repository: KAOS-repositories/business_consulting
  track: workflow
  depends_on:
  - portfolio-consistency-checks
  - arrears-monitoring
  status: not started
  notes: 'real_estate/structured_portfolio.py: subclassed in a file beside the documents,
    answering PortfolioQuestion members (unanswered raise UnansweredQuestion). SourceDocumentRoot
    gains a portfolios directory. scripts/run_portfolio.py reads the statements, runs checks
    and monitoring, writes portfolio.sqlite beside the documents. End-to-end test: two buildings,
    three leases.

    '
- id: manage-portfolio-skill
