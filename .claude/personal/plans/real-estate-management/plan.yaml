schema_version: 1
id: real-estate-management
title: Real estate management
description: 'A landlord''s portfolio as a subpackage business_consulting.real_estate: properties,
  buildings and rental units, lease agreements, and the account the rent goes into. The tool
  checks the portfolio for consistency, matches the rent account''s camt.053 bookings to tenants
  and claims, and monitors arrears. A Claude skill writes the portfolio file from conversation
  with the landlord; FinTS fetches the statements last.

  '
default_repository: tomsch420/business_consulting-notes
tracking_issue: 127
waves:
- id: foundation
  name: Foundation
  description: Up-to-date krrood, then the model and the monitoring it carries out
- id: operation
  name: Operation
  description: Running a portfolio, the operator skill, the live bank link
tracks:
- id: setup
  name: Installation
  wave: foundation
- id: domain
  name: Domain model and monitoring
  wave: foundation
- id: workflow
  name: Portfolio workflow
  wave: operation
- id: bank-link
  name: Bank link
  wave: operation
items:
